<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Frilansare För Fred – samtal, projekt och evenemang för att förebygga väpnade konflikter.">
  <title>Frilansare För Fred</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div id="my-circle" class="shared-circle" aria-label="Din cirkel" title="Dra mig"></div>
  <svg id="discovery-veil" aria-hidden="true" preserveAspectRatio="none">
    <defs>
      <filter id="veil-window-feather" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="58"></feGaussianBlur>
      </filter>
      <filter id="line-window-feather" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="58"></feGaussianBlur>
      </filter>
      <mask id="window-mask" maskUnits="userSpaceOnUse">
        <rect width="100%" height="100%" fill="white"></rect>
        <g id="discovery-windows" filter="url(#veil-window-feather)"></g>
      </mask>
      <mask id="line-mask" maskUnits="userSpaceOnUse">
        <rect width="100%" height="100%" fill="white"></rect>
        <g id="line-windows" filter="url(#line-window-feather)"></g>
      </mask>
    </defs>
    <rect width="100%" height="100%" fill="white" mask="url(#window-mask)"></rect>
    <g id="structure-lines" mask="url(#line-mask)"></g>
  </svg>

  <main class="split">
    <aside id="left" aria-labelledby="site-title">
      <div class="left-wrap" id="info-content" aria-busy="true">
        <p class="loading-message">Laddar…</p>
      </div>
    </aside>

    <section id="right" aria-label="Aktuellt och tidigare evenemang">
      <div class="right-wrap" id="blog-content" aria-busy="true">
        <p class="loading-message">Laddar…</p>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
